# Free Supabase projects fall asleep after a week with no activity, and the apps
# only send their counts once a month. This gives the database a tiny nudge
# every 3 days so it's awake when they do. It reads nothing and costs nothing.
#
# Setup (once): GitHub repo > Settings > Secrets and variables > Actions > New secret
#   SUPABASE_URL  e.g. https://abcdefghij.supabase.co
#   SUPABASE_KEY  the publishable key (starts sb_publishable_)
#
# Note: GitHub pauses scheduled jobs in a repo with no commits for 60 days and
# emails you first. If that email arrives, open Actions and press "Enable workflow".
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
