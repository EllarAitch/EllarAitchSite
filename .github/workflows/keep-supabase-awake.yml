# Free Supabase projects pause after a week without enough activity, and the apps
# only send their counts once a month. This calls the ping() function (a tiny
# read of the counts table) twice a day so the project stays awake. Supabase
# says "a few requests each day" is usually enough; every 3 days was not
# (pause warning email, 22 Nov 2026). Costs nothing.
#
# Setup (once): GitHub repo > Settings > Secrets and variables > Actions > New secret
#   SUPABASE_URL  e.g. https://abcdefghij.supabase.co
#   SUPABASE_KEY  the publishable key (starts sb_publishable_)
#
# Note: GitHub pauses scheduled jobs in a repo with no commits for 60 days and
# emails you first. If that email arrives, open Actions and press "Enable workflow".
name: Keep Supabase awake
on:
  schedule:
    # 03:17 and 15:17 UTC (about 1:47 pm and 1:47 am in Adelaide)
    - cron: '17 3,15 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Strip any trailing slash so the address doesn't end up as //rest/...
          curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}'
